<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#059669"/>
    </marker>
    
  </defs>

  <text x="20" y="26" class="hdr" fill="#334155" font-size="12px" font-weight="700" letter-spacing=".06em">RECONCILE(InferenceService) — level-triggered, every 2s, at most one corrective action per pass</text>

  <!-- 1 admission -->
  <rect x="20" y="46" width="210" height="66" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="32" y="68" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">1 · Admit the spec</text>
  <text x="32" y="86" class="s" fill="#475569" font-size="11px">run vLLM's memory arithmetic</text>
  <text x="32" y="101" class="s" fill="#475569" font-size="11px">on the CPU — 1.2 µs</text>

  <path d="M230 79 H300" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <polygon points="300,79 372,50 444,79 372,108" class="dec" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="372" y="76" class="t" text-anchor="middle" fill="#0f172a" font-size="13px">KV cache</text>
  <text x="372" y="92" class="t" text-anchor="middle" fill="#0f172a" font-size="13px">possible?</text>

  <path d="M372 108 V150" stroke="#dc2626" stroke-width="1.5" marker-end="url(#ar)" fill="none"/>
  <text x="382" y="132" class="lbl" fill="#64748b" font-size="11px" font-style="italic">no</text>
  <rect x="252" y="150" width="240" height="60" class="bad" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8" />
  <text x="264" y="172" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">status.admission.feasible = false</text>
  <text x="264" y="190" class="s" fill="#475569" font-size="11px">report the feasible window. Never</text>
  <text x="264" y="204" class="s" fill="#475569" font-size="11px">create a pod that cannot boot.</text>

  <path d="M444 79 H520" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)" fill="none"/>
  <text x="470" y="70" class="lbl" fill="#64748b" font-size="11px" font-style="italic">yes</text>

  <!-- 2 observe -->
  <rect x="520" y="46" width="230" height="66" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="532" y="68" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">2 · Observe</text>
  <text x="532" y="86" class="s" fill="#475569" font-size="11px">owned pods, node conditions,</text>
  <text x="532" y="101" class="s" fill="#475569" font-size="11px">spare nvidia.com/gpu</text>

  <path d="M750 79 H830 V150" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

  <!-- 3 readiness gate -->
  <rect x="700" y="150" width="260" height="86" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="712" y="172" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">3 · Gate readiness</text>
  <text x="712" y="190" class="s" fill="#475569" font-size="11px">GET /metrics on each pod IP</text>
  <text x="712" y="205" class="s" fill="#475569" font-size="11px">vllm:num_gpu_blocks &gt; 0 ?</text>
  <text x="712" y="223" class="s" fill="#475569" font-size="11px">→ patch pod readinessGate condition</text>

  <path d="M830 236 V286" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <rect x="700" y="286" width="260" height="52" class="act" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="8" />
  <text x="712" y="308" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">Service endpoints</text>
  <text x="712" y="326" class="s" fill="#475569" font-size="11px">only engines with a KV cache</text>

  <!-- 4 gpu health -->
  <rect x="20" y="252" width="250" height="86" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="32" y="274" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">4 · GPU health</text>
  <text x="32" y="292" class="s" fill="#475569" font-size="11px">node condition GPUUnhealthy=True</text>
  <text x="32" y="307" class="s" fill="#475569" font-size="11px">(written by the node agent)</text>
  <text x="32" y="325" class="s" fill="#475569" font-size="11px">→ evict, quarantine, never reschedule</text>
  <path d="M270 295 H340" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <rect x="340" y="266" width="230" height="52" class="bad" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8" />
  <text x="352" y="288" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">status.quarantinedNodes</text>
  <text x="352" y="306" class="s" fill="#475569" font-size="11px">excluded from nodeAffinity</text>

  <!-- 5 rollout -->
  <text x="20" y="382" class="hdr" fill="#334155" font-size="12px" font-weight="700" letter-spacing=".06em">5 · ROLL OUT — the question a Deployment never asks</text>
  <rect x="20" y="396" width="200" height="60" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="32" y="418" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">stale pods exist</text>
  <text x="32" y="437" class="s" fill="#475569" font-size="11px">spec revision changed</text>

  <path d="M220 426 H286" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <polygon points="286,426 384,392 482,426 384,460" class="dec" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
  <text x="384" y="421" class="t" text-anchor="middle" fill="#0f172a" font-size="13px">spare GPU ≥</text>
  <text x="384" y="437" class="t" text-anchor="middle" fill="#0f172a" font-size="13px">tensorParallelSize?</text>

  <path d="M482 426 H560" stroke="#059669" stroke-width="1.5" marker-end="url(#ag)" fill="none"/>
  <text x="505" y="417" class="lbl" fill="#64748b" font-size="11px" font-style="italic">yes</text>
  <rect x="560" y="382" width="400" height="76" class="act" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" rx="8" />
  <text x="572" y="404" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">SURGE — build first, retire second</text>
  <text x="572" y="423" class="s" fill="#475569" font-size="11px">create replacement → wait for its KV cache → delete old pod</text>
  <text x="572" y="441" class="s" fill="#475569" font-size="11px">zero downtime; costs one extra GPU for the weight load</text>

  <path d="M384 460 V500" stroke="#d97706" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <text x="394" y="484" class="lbl" fill="#64748b" font-size="11px" font-style="italic">no</text>
  <rect x="180" y="500" width="410" height="94" class="box" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8" />
  <text x="192" y="522" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">DRAIN FIRST — the replacement has nowhere to go</text>
  <text x="192" y="541" class="s" fill="#475569" font-size="11px">① flip vllmops.io/serving label → out of Service endpoints</text>
  <text x="192" y="558" class="s" fill="#475569" font-size="11px">② poll vllm:num_requests_running until in-flight decodes finish</text>
  <text x="192" y="575" class="s" fill="#475569" font-size="11px">③ delete, releasing the GPU  ④ create replacement</text>

  <path d="M590 547 H700" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <rect x="700" y="500" width="260" height="94" class="bad" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8" />
  <text x="712" y="522" class="tb" fill="#0f172a" font-size="13.5px" font-weight="650">downtime is unavoidable</text>
  <text x="712" y="541" class="s" fill="#475569" font-size="11px">≈ one full weight load</text>
  <text x="712" y="559" class="s" fill="#475569" font-size="11px">but no request is cut mid-stream,</text>
  <text x="712" y="576" class="s" fill="#475569" font-size="11px">and the rollout actually completes</text>

  <path d="M180 547 H120 V470 H20 V112" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)" fill="none"/>
  <text x="26" y="470" class="lbl" fill="#64748b" font-size="11px" font-style="italic">next pass</text>
</svg>
